  <rect x="64" y="405" width="1228" height="120" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="92" y="444" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">Selected lesson: Intake</text>
  <text x="92" y="475" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="15">Purpose: turn messy overnight analyst notes into a structured JSON intake record.</text>
  <text x="92" y="503" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="15">Skill: field extraction and JSON basics</text>
  <text x="515" y="503" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="15">Artifact: market-intake.json</text>
  <text x="835" y="503" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="15">Lesson flow: Intro -> Exercise -> Takeaway</text>

  <text x="64" y="575" fill="#4B5563" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">REAL WORKFLOW MAP</text>

  <g id="workflow-map">
    <rect x="64" y="640" width="170" height="80" rx="8" fill="#F97316" stroke="#111827" stroke-width="3"/>
    <text x="96" y="674" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Analyst Notes</text>
    <text x="96" y="700" fill="#FFEDD5" font-family="Segoe UI, Arial, sans-serif" font-size="13">messy source input</text>

    <path d="M234 680 C300 680 310 680 376 680" stroke="#0F5E7C" stroke-width="4"/>
    <polygon points="376,680 362,672 362,688" fill="#0F5E7C"/>

    <rect x="376" y="620" width="190" height="120" rx="8" fill="#0F6888" stroke="#111827" stroke-width="3"/>
    <text x="414" y="662" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Intake Record</text>
    <text x="414" y="690" fill="#DFF7FF" font-family="Segoe UI, Arial, sans-serif" font-size="13">market-intake.json</text>
    <rect x="414" y="704" width="84" height="24" rx="12" fill="#DBEAFE"/>
    <text x="432" y="721" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Built in 1</text>

    <path d="M566 680 C626 680 650 680 710 680" stroke="#0F5E7C" stroke-width="4"/>
    <polygon points="710,680 696,672 696,688" fill="#0F5E7C"/>

    <rect x="710" y="620" width="190" height="120" rx="8" fill="#0F6888" stroke="#111827" stroke-width="3" opacity="0.85"/>
    <text x="752" y="662" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Clean Data</text>
    <text x="752" y="690" fill="#DFF7FF" font-family="Segoe UI, Arial, sans-serif" font-size="13">price table</text>
    <rect x="752" y="704" width="84" height="24" rx="12" fill="#E5E7EB"/>
    <text x="767" y="721" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Built in 2</text>

    <path d="M900 680 C960 680 980 680 1040 680" stroke="#0F5E7C" stroke-width="4"/>
    <polygon points="1040,680 1026,672 1026,688" fill="#0F5E7C"/>

    <rect x="1040" y="620" width="190" height="120" rx="8" fill="#0F6888" stroke="#111827" stroke-width="3" opacity="0.85"/>
    <text x="1078" y="662" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Risk Evaluation</text>
    <text x="1078" y="690" fill="#DFF7FF" font-family="Segoe UI, Arial, sans-serif" font-size="13">threshold rules</text>
    <rect x="1078" y="704" width="84" height="24" rx="12" fill="#E5E7EB"/>
    <text x="1093" y="721" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Built in 3</text>

    <path d="M1135 740 L1135 790" stroke="#0F5E7C" stroke-width="4"/>
    <polygon points="1135,790 1127,776 1143,776" fill="#0F5E7C"/>
    <rect x="1005" y="790" width="260" height="78" rx="8" fill="#FFFFFF" stroke="#0F5E7C" stroke-width="3"/>
    <text x="1036" y="824" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Approval Needed?</text>
    <text x="1036" y="850" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13">decision point created by Evaluate</text>

    <path d="M1005 829 C930 829 910 829 835 829" stroke="#0F5E7C" stroke-width="4"/>
    <polygon points="835,829 849,821 849,837" fill="#0F5E7C"/>
    <rect x="635" y="790" width="200" height="78" rx="8" fill="#0F6888" stroke="#111827" stroke-width="3" opacity="0.85"/>
    <text x="684" y="824" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Route</text>
    <text x="684" y="850" fill="#DFF7FF" font-family="Segoe UI, Arial, sans-serif" font-size="13">approval decision</text>

    <path d="M635 829 C565 829 535 829 465 829" stroke="#0F5E7C" stroke-width="4"/>
    <polygon points="465,829 479,821 479,837" fill="#0F5E7C"/>
    <rect x="265" y="790" width="200" height="78" rx="8" fill="#0F6888" stroke="#111827" stroke-width="3" opacity="0.85"/>
    <text x="316" y="824" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">Brief</text>
    <text x="316" y="850" fill="#DFF7FF" font-family="Segoe UI, Arial, sans-serif" font-size="13">7:00 AM summary</text>

    <path d="M1040 650 C980 580 905 552 835 552" stroke="#CBD5E1" stroke-width="3" stroke-dasharray="8 8"/>
    <text x="840" y="548" fill="#64748B" font-family="Segoe UI, Arial, sans-serif" font-size="13">routine path can bypass approval later</text>
  </g>

  <rect x="64" y="895" width="1228" height="1" fill="#D1D5DB"/>
  <text x="64" y="925" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">Concept: top cards are the lesson path; lower diagram is the real workflow map. Completing lessons fills in workflow artifacts.</text>
</svg>
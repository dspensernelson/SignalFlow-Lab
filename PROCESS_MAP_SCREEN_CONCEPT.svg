<svg width="1440" height="950" viewBox="0 0 1440 950" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="950" fill="#F3F4F6"/>

  <text x="64" y="50" fill="#2563EB" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">SIGNALFLOW LAB</text>
  <text x="64" y="82" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700">Meridian Morning Market Brief</text>
  <text x="64" y="112" fill="#4B5563" font-family="Segoe UI, Arial, sans-serif" font-size="15">Build a workplace automation that turns messy overnight market inputs into an approval-ready 7:00 AM brief.</text>
  <text x="64" y="145" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">Progress: 0 of 5 steps complete</text>

  <rect x="1226" y="45" width="112" height="38" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="1250" y="69" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="14">Start Over</text>

  <text x="64" y="190" fill="#4B5563" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="1.4">LESSON PATH</text>

  <g id="lesson-cards">
    <rect x="64" y="220" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
    <text x="84" y="254" fill="#111827" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">1. Intake</text>
    <rect x="84" y="270" width="54" height="24" rx="12" fill="#DBEAFE"/>
    <text x="99" y="287" fill="#1D4ED8" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Ready</text>
    <text x="84" y="316" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="13">Output: structured</text>
    <text x="84" y="334" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="13">market intake record</text>
    <rect x="84" y="346" width="96" height="34" rx="6" fill="#2563EB"/>
    <text x="105" y="368" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700">Start here</text>

    <text x="278" y="300" fill="#9CA3AF" font-family="Segoe UI, Arial, sans-serif" font-size="22">-></text>

    <rect x="324" y="220" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="344" y="254" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">2. Structure</text>
    <rect x="344" y="270" width="64" height="24" rx="12" fill="#E5E7EB"/>
    <text x="360" y="287" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Locked</text>
    <text x="344" y="316" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">Output: clean price</text>
    <text x="344" y="334" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">data table</text>
    <text x="344" y="363" fill="#9CA3AF" font-family="Segoe UI, Arial, sans-serif" font-size="13">Complete Intake first</text>

    <text x="538" y="300" fill="#9CA3AF" font-family="Segoe UI, Arial, sans-serif" font-size="22">-></text>

    <rect x="584" y="220" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="604" y="254" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">3. Evaluate</text>
    <rect x="604" y="270" width="64" height="24" rx="12" fill="#E5E7EB"/>
    <text x="620" y="287" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Locked</text>
    <text x="604" y="316" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">Output: risk</text>
    <text x="604" y="334" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">evaluation record</text>

    <text x="798" y="300" fill="#9CA3AF" font-family="Segoe UI, Arial, sans-serif" font-size="22">-></text>

    <rect x="844" y="220" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="864" y="254" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">4. Route</text>
    <rect x="864" y="270" width="64" height="24" rx="12" fill="#E5E7EB"/>
    <text x="880" y="287" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Locked</text>
    <text x="864" y="316" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">Output: approval</text>
    <text x="864" y="334" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">routing decision</text>

    <text x="1058" y="300" fill="#9CA3AF" font-family="Segoe UI, Arial, sans-serif" font-size="22">-></text>

    <rect x="1104" y="220" width="190" height="150" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="1124" y="254" fill="#374151" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">5. Brief</text>
    <rect x="1124" y="270" width="64" height="24" rx="12" fill="#E5E7EB"/>
    <text x="1140" y="287" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="700">Locked</text>
    <text x="1124" y="316" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">Output: morning</text>
    <text x="1124" y="334" fill="#6B7280" font-family="Segoe UI, Arial, sans-serif" font-size="13">market brief</text>

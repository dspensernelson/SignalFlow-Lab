[project]
name = "signalflow-middleware"
version = "0.1.0"
description = "SignalFlow Lab: Middleware - the learner's build workspace (donor-ops middleware for a small nonprofit)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.11",
  "typer>=0.16",
  "python-dotenv>=1.1",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "pytest>=8.3",
  "pytest-asyncio>=0.26",
]

[project.optional-dependencies]
# Module 2+: the MCP Python SDK (2.x targets the 2026-07-28 spec).
mcp = ["mcp>=2.0"]
# Module 6: OpenTelemetry tracing.
otel = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30"]
# Module 5.3: CPU-only embeddings + a SQLite vector extension.
rag = ["fastembed>=0.7", "sqlite-vec>=0.1.6"]
# Module 7: LangGraph orchestration over the MCP server.
graph = ["langgraph>=1.0", "langchain-core>=1.0", "langchain-mcp-adapters>=0.1"]
all = [
  "signalflow-middleware[mcp,otel,rag,graph]",
]

[tool.pytest.ini_options]
testpaths = ["checks"]
asyncio_mode = "auto"
markers = [
  "live: needs a real model provider (LLM_PROVIDER + its key); skipped otherwise",
  "docker: needs a Docker daemon (set DOCKER_AVAILABLE=1); skipped otherwise",
  "deployed: needs a deployed URL (set DEPLOY_URL); skipped otherwise",
]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mock_services", "tools", "mcp_server", "evals", "agent", "hello"]

<!-- @dsCard group="Colors" viewport="700x230" name="Surfaces — light & dark" subtitle="The product ships both themes via data-theme" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{font-family:var(--sf-font-sans);padding:20px;background:#e8eaed;display:flex;gap:16px}
  .theme{flex:1;border-radius:var(--sf-radius-xl);padding:16px;background:var(--sf-bg);border:1px solid var(--sf-border)}
  .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--sf-text-subtle);margin-bottom:10px}
  .card{background:var(--sf-surface);border:1px solid var(--sf-border);border-radius:var(--sf-radius-lg);padding:12px;box-shadow:var(--sf-shadow-sm);margin-bottom:10px}
  .h{font-size:14px;font-weight:600;color:var(--sf-text)}
  .p{font-size:12px;color:var(--sf-text-muted);margin-top:4px}
  .inset{background:var(--sf-surface-subtle);border:1px solid var(--sf-border-subtle);border-radius:var(--sf-radius-md);padding:8px;font-family:var(--sf-font-mono);font-size:11px;color:var(--sf-text-body);margin-top:8px}
  .btn{display:inline-block;margin-top:10px;background:var(--sf-accent);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:var(--sf-radius-md)}
</style></head>
<body>
  <div class="theme">
    <div class="lbl">Light (default)</div>
    <div class="card"><div class="h">Market Intake Record</div><div class="p">First trusted record</div><div class="inset">market-intake.json</div></div>
    <span class="btn">Start lesson</span>
  </div>
  <div class="theme" data-theme="dark">
    <div class="lbl">Dark</div>
    <div class="card"><div class="h">Market Intake Record</div><div class="p">First trusted record</div><div class="inset">market-intake.json</div></div>
    <span class="btn">Start lesson</span>
  </div>
</body></html>

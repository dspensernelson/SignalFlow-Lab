<!-- @dsCard group="Colors" viewport="700x150" name="Feedback colors" subtitle="Success, danger, warning, info surfaces" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--sf-bg);font-family:var(--sf-font-sans);padding:20px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .sw{flex:1;min-width:130px;border-radius:var(--sf-radius-lg);padding:12px 14px}
  .name{font-size:12px;font-weight:600}
  .desc{font-size:11px;margin-top:3px;opacity:.85}
</style></head>
<body>
<div class="row">
  <div class="sw" style="background:var(--sf-success-weak);border:1px solid var(--sf-green-300);color:var(--sf-green-800)"><div class="name">Success</div><div class="desc">Lesson passed, artifact built</div></div>
  <div class="sw" style="background:var(--sf-danger-weak);border:1px solid var(--sf-red-200);color:var(--sf-red-800)"><div class="name">Danger</div><div class="desc">Failed validation check</div></div>
  <div class="sw" style="background:var(--sf-warning-weak);border:1px solid var(--sf-amber-300);color:var(--sf-amber-800)"><div class="name">Warning</div><div class="desc">Needs more inputs / notice</div></div>
  <div class="sw" style="background:var(--sf-info-weak);border:1px solid var(--sf-indigo-200);color:var(--sf-indigo-900)"><div class="name">Info</div><div class="desc">Copilot prompt coach</div></div>
</div>
</body></html>

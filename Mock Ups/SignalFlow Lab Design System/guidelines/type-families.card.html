<!-- @dsCard group="Type" viewport="700x190" name="Font families" subtitle="Segoe UI system sans + Consolas mono" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--sf-bg);font-family:var(--sf-font-sans);padding:22px;color:var(--sf-text)}
  .block{margin-bottom:18px}
  .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--sf-text-subtle);margin-bottom:6px}
  .sans{font-family:var(--sf-font-sans);font-size:30px;font-weight:600;letter-spacing:-.01em}
  .mono{font-family:var(--sf-font-mono);font-size:20px;color:var(--sf-text-body)}
  .stack{font-size:11px;color:var(--sf-text-muted);margin-top:6px;font-family:var(--sf-font-mono)}
</style></head>
<body>
  <div class="block">
    <div class="lbl">Sans — UI &amp; prose</div>
    <div class="sans">Meridian Morning Market Brief</div>
    <div class="stack">'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont…</div>
  </div>
  <div class="block">
    <div class="lbl">Mono — JSON, filenames, code</div>
    <div class="mono">{ "hub": "ERCOT", "approvalRequired": true }</div>
    <div class="stack">Consolas, ui-monospace, 'SF Mono', Menlo, Monaco…</div>
  </div>
</body></html>

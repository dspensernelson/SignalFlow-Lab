<!-- @dsCard group="Spacing" viewport="700x160" name="Radii" subtitle="From 4px chips to fully-round pills" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--sf-bg);font-family:var(--sf-font-sans);padding:22px;display:flex;gap:18px;flex-wrap:wrap}
  .b{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:80px;height:60px;background:var(--sf-surface);border:1px solid var(--sf-border-strong);box-shadow:var(--sf-shadow-sm)}
  .t{font-family:var(--sf-font-mono);font-size:11px;color:var(--sf-text-muted)}
</style></head>
<body>
  <div class="b"><div class="box" style="border-radius:var(--sf-radius-sm)"></div><span class="t">sm · 4</span></div>
  <div class="b"><div class="box" style="border-radius:var(--sf-radius-md)"></div><span class="t">md · 6</span></div>
  <div class="b"><div class="box" style="border-radius:var(--sf-radius-lg)"></div><span class="t">lg · 8</span></div>
  <div class="b"><div class="box" style="border-radius:var(--sf-radius-xl)"></div><span class="t">xl · 12</span></div>
  <div class="b"><div class="box" style="border-radius:var(--sf-radius-2xl)"></div><span class="t">2xl · 16</span></div>
  <div class="b"><div class="box" style="border-radius:var(--sf-radius-full);width:60px"></div><span class="t">full</span></div>
</body></html>

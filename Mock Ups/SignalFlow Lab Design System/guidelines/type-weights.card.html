<!-- @dsCard group="Type" viewport="700x150" name="Weights & eyebrow labels" subtitle="Uppercase tracked labels are a signature" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--sf-bg);font-family:var(--sf-font-sans);padding:22px;color:var(--sf-text);display:flex;gap:36px;align-items:flex-start}
  .col{display:flex;flex-direction:column;gap:10px}
  .lbl{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--sf-text-subtle)}
  .w{font-size:18px}
</style></head>
<body>
  <div class="col">
    <span class="lbl">Weights</span>
    <span class="w" style="font-weight:400">Normal 400 — body</span>
    <span class="w" style="font-weight:500">Medium 500 — labels</span>
    <span class="w" style="font-weight:600">Semibold 600 — headings</span>
    <span class="w" style="font-weight:700">Bold 700 — type labels</span>
  </div>
  <div class="col">
    <span class="lbl">Eyebrow labels</span>
    <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--sf-text-subtle)">Workflow Map · tracking-wide</span>
    <span style="font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--sf-text-subtle)">Phase 1 · tracking-widest</span>
    <span style="font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--sf-accent)">SIGNALFLOW LAB</span>
  </div>
</body></html>

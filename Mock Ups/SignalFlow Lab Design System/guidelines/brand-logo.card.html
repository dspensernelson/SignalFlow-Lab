<!-- @dsCard group="Brand" viewport="700x180" name="Logo lockup" subtitle="Signal-bars mark + wordmark, light & dark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{font-family:var(--sf-font-sans);padding:0;display:flex}
  .pane{flex:1;padding:26px;background:var(--sf-bg);display:flex;flex-direction:column;gap:20px;justify-content:center}
  .lock{display:flex;align-items:center;gap:12px}
  .word{font-weight:600;font-size:22px;letter-spacing:-.01em;color:var(--sf-text)}
  .word-up{font-weight:600;font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--sf-text)}
</style></head>
<body>
  <div class="pane">
    <div class="lock">
      <svg width="30" height="30" viewBox="0 0 24 24"><rect x="1" y="9" width="4" height="11" rx="1.5" fill="var(--sf-accent)" opacity=".55"/><rect x="7" y="4" width="4" height="16" rx="1.5" fill="var(--sf-accent)"/><rect x="13" y="12" width="4" height="8" rx="1.5" fill="var(--sf-accent)" opacity=".79"/><rect x="19" y="6" width="4" height="14" rx="1.5" fill="var(--sf-accent)" opacity=".91"/></svg>
      <span class="word">SignalFlow Lab</span>
    </div>
    <div class="lock">
      <svg width="22" height="22" viewBox="0 0 24 24"><rect x="1" y="9" width="4" height="11" rx="1.5" fill="var(--sf-accent)" opacity=".55"/><rect x="7" y="4" width="4" height="16" rx="1.5" fill="var(--sf-accent)"/><rect x="13" y="12" width="4" height="8" rx="1.5" fill="var(--sf-accent)" opacity=".79"/><rect x="19" y="6" width="4" height="14" rx="1.5" fill="var(--sf-accent)" opacity=".91"/></svg>
      <span class="word-up">SignalFlow Lab</span>
    </div>
  </div>
  <div class="pane" data-theme="dark">
    <div class="lock">
      <svg width="30" height="30" viewBox="0 0 24 24"><rect x="1" y="9" width="4" height="11" rx="1.5" fill="var(--sf-accent)" opacity=".55"/><rect x="7" y="4" width="4" height="16" rx="1.5" fill="var(--sf-accent)"/><rect x="13" y="12" width="4" height="8" rx="1.5" fill="var(--sf-accent)" opacity=".79"/><rect x="19" y="6" width="4" height="14" rx="1.5" fill="var(--sf-accent)" opacity=".91"/></svg>
      <span class="word">SignalFlow Lab</span>
    </div>
    <div class="lock">
      <svg width="22" height="22" viewBox="0 0 24 24"><rect x="1" y="9" width="4" height="11" rx="1.5" fill="var(--sf-accent)" opacity=".55"/><rect x="7" y="4" width="4" height="16" rx="1.5" fill="var(--sf-accent)"/><rect x="13" y="12" width="4" height="8" rx="1.5" fill="var(--sf-accent)" opacity=".79"/><rect x="19" y="6" width="4" height="14" rx="1.5" fill="var(--sf-accent)" opacity=".91"/></svg>
      <span class="word-up">SignalFlow Lab</span>
    </div>
  </div>
</body></html>

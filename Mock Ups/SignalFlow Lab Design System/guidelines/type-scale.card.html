<!-- @dsCard group="Type" viewport="700x260" name="Type scale" subtitle="9px micro-labels up to 24px page titles" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--sf-bg);font-family:var(--sf-font-sans);padding:22px;color:var(--sf-text)}
  .r{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--sf-border-subtle)}
  .tok{font-family:var(--sf-font-mono);font-size:11px;color:var(--sf-text-subtle);width:96px;flex-shrink:0}
  .ex{color:var(--sf-text)}
</style></head>
<body>
  <div class="r"><span class="tok">2xl / 24</span><span class="ex" style="font-size:24px;font-weight:600">Project title</span></div>
  <div class="r"><span class="tok">lg / 18</span><span class="ex" style="font-size:18px;font-weight:600">Lesson section heading</span></div>
  <div class="r"><span class="tok">base / 16</span><span class="ex" style="font-size:16px">Prose body copy</span></div>
  <div class="r"><span class="tok">sm / 14</span><span class="ex" style="font-size:14px">Default body &amp; controls</span></div>
  <div class="r"><span class="tok">xs / 12</span><span class="ex" style="font-size:12px">Chips, captions, small buttons</span></div>
  <div class="r"><span class="tok">11 / 11</span><span class="ex" style="font-size:11px">Dense panel body</span></div>
  <div class="r"><span class="tok">10 / 10</span><span class="ex" style="font-size:10px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--sf-text-subtle)">Node type label</span></div>
  <div class="r"><span class="tok">9 / 9</span><span class="ex" style="font-size:9px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--sf-text-subtle)">Micro panel label</span></div>
</body></html>

<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Soft shadows; nodes glow only in dark" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--sf-bg);font-family:var(--sf-font-sans);padding:26px;display:flex;gap:26px;flex-wrap:wrap;align-items:center}
  .b{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:120px;height:64px;background:var(--sf-surface);border:1px solid var(--sf-border);border-radius:var(--sf-radius-lg)}
  .t{font-family:var(--sf-font-mono);font-size:11px;color:var(--sf-text-muted)}
  .dark{background:var(--sf-bg);padding:18px;border-radius:var(--sf-radius-lg)}
</style></head>
<body>
  <div class="b"><div class="box" style="box-shadow:var(--sf-shadow-sm)"></div><span class="t">shadow-sm · cards</span></div>
  <div class="b"><div class="box" style="box-shadow:var(--sf-shadow-md)"></div><span class="t">shadow-md · popovers</span></div>
  <div class="b"><div class="box" style="box-shadow:var(--sf-shadow-lg)"></div><span class="t">shadow-lg · modals</span></div>
  <div class="dark" data-theme="dark"><div class="b"><div class="box" style="box-shadow:var(--sf-shadow-glow);border-color:var(--sf-accent)"></div><span class="t">glow · selected node (dark)</span></div></div>
</body></html>

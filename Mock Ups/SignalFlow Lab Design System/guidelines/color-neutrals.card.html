<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="The workspace chrome — Tailwind gray" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  html,body{margin:0}
  body{background:var(--sf-bg);font-family:var(--sf-font-sans);padding:20px}
  .row{display:flex;gap:6px;flex-wrap:nowrap}
  .sw{flex:1;border-radius:var(--sf-radius-md);border:1px solid var(--sf-border);overflow:hidden}
  .chip{height:58px}
  .meta{padding:6px 7px;background:var(--sf-surface)}
  .name{font-size:11px;font-weight:600;color:var(--sf-text)}
  .hex{font-family:var(--sf-font-mono);font-size:10px;color:var(--sf-text-muted)}
</style></head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:var(--sf-gray-50)"></div><div class="meta"><div class="name">50</div><div class="hex">f9fafb</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sf-gray-100)"></div><div class="meta"><div class="name">100</div><div class="hex">f3f4f6</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sf-gray-200)"></div><div class="meta"><div class="name">200</div><div class="hex">e5e7eb</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sf-gray-300)"></div><div class="meta"><div class="name">300</div><div class="hex">d1d5db</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sf-gray-400)"></div><div class="meta"><div class="name">400</div><div class="hex">9ca3af</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sf-gray-500)"></div><div class="meta"><div class="name">500</div><div class="hex">6b7280</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sf-gray-700)"></div><div class="meta"><div class="name">700</div><div class="hex">374151</div></div></div>
  <div class="sw"><div class="chip" style="background:var(--sf-gray-900)"></div><div class="meta"><div class="name">900</div><div class="hex">111827</div></div></div>
</div>
</body></html>

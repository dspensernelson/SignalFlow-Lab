<!-- @dsCard group="Components" viewport="700x420" name="Workflow — canvas nodes & lesson stepper" subtitle="All 8 node types, status skins, selection rings, step flow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--sf-bg); color: var(--sf-text); font-family: var(--sf-font-sans); padding: 22px; }
  .wrap { display: flex; flex-direction: column; gap: 20px; }
  .grid { display: flex; flex-wrap: wrap; gap: 12px; }
  .lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--sf-text-subtle); margin-bottom: 8px; }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { WorkflowNode, Stepper } = window.SignalFlowLabDesignSystem_4c48cf;

function Demo() {
  return (
    <div className="wrap">
      <div>
        <div className="lbl">Node type palette — all eight workflow objects</div>
        <div className="grid">
          <WorkflowNode type="source"    label="Overnight Market Data"  status="context" />
          <WorkflowNode type="reference" label="Threshold Policy"       artifactName="threshold-policy.json" status="ready" />
          <WorkflowNode type="artifact"  label="Market Intake Record"   artifactName="market-intake.json"    status="complete" />
          <WorkflowNode type="process"   label="Price Normalization"    status="in-progress" />
          <WorkflowNode type="decision"  label="Approval Decision"      status="upcoming" />
          <WorkflowNode type="handoff"   label="Distribution Route"     status="needs-inputs" />
          <WorkflowNode type="output"    label="Morning Brief"          artifactName="market-brief.md" status="locked" />
          <WorkflowNode type="archive"   label="Distribution Archive"   status="locked" />
        </div>
      </div>

      <div>
        <div className="lbl">Signal-flow relationships — raw → structured → trusted → reuse</div>
        <div className="grid">
          <WorkflowNode type="source"   label="Overnight Market Data" status="context"     relation="upstream" />
          <WorkflowNode type="artifact" label="Market Intake Record"  artifactName="market-intake.json" status="complete" relation="selected" />
          <WorkflowNode type="process"  label="Price Normalization"   status="in-progress" relation="downstream" />
          <WorkflowNode type="handoff"  label="Distribution Route"    status="needs-inputs" dimmed />
        </div>
      </div>

      <div>
        <div className="lbl">Lesson stepper</div>
        <Stepper steps={['Intro', 'Exercise', 'Takeaway']} current={1} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>

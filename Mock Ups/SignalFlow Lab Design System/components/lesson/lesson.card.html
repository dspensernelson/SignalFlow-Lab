<!-- @dsCard group="Components" viewport="700x400" name="Lesson — code, field guide, validation" subtitle="JSON wells, field reference rows, pass/fail results" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  html, body { margin: 0; }
  body { background: var(--sf-bg); color: var(--sf-text); font-family: var(--sf-font-sans); padding: 22px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .panel { background: var(--sf-surface); border: 1px solid var(--sf-border); border-radius: var(--sf-radius-xl); padding: 16px; box-shadow: var(--sf-shadow-sm); }
  .lbl { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--sf-text-subtle); margin-bottom: 10px; }
  .stack { display: flex; flex-direction: column; gap: 8px; }
</style>
</head>
<body>
<div class="cols" id="cols">
  <div class="panel">
    <div class="lbl">JSON Example</div>
    <div id="code"></div>
  </div>
  <div class="panel">
    <div class="lbl">Field Guide</div>
    <div id="fields" class="stack"></div>
  </div>
  <div class="panel">
    <div class="lbl">Source Note</div>
    <div id="note"></div>
  </div>
  <div class="panel">
    <div class="lbl">Validation Results</div>
    <div id="val" class="stack"></div>
  </div>
</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { CodeBlock, FieldGuideRow, ValidationRow } = window.SignalFlowLabDesignSystem_4c48cf;

ReactDOM.createRoot(document.getElementById('code')).render(
  <CodeBlock>{`{\n  "hub": "ERCOT",\n  "peakPrice": "$187/MWh",\n  "settledPrice": "$142/MWh",\n  "approvalRequired": true\n}`}</CodeBlock>
);

ReactDOM.createRoot(document.getElementById('note')).render(
  <CodeBlock wrap>{`Checked overnight prices. ERCOT hub spiked around 2am, hit $187/MWh briefly then settled near $142/MWh. Trader flagged the hub spike for review. Need approval if we move on this.`}</CodeBlock>
);

ReactDOM.createRoot(document.getElementById('fields')).render(
  <>
    <FieldGuideRow divider={false} field="hub" type="string" meaning="The market hub mentioned in the note." example={'"ERCOT"'} hint="Look for the named trading hub." />
    <FieldGuideRow field="peakPrice" type="string" meaning="The highest price mentioned." example={'"$187/MWh"'} hint="Find the spike before it settled." />
    <FieldGuideRow field="approvalRequired" type="boolean" meaning="Whether approval is needed." example="true" hint="Use true or false." />
  </>
);

ReactDOM.createRoot(document.getElementById('val')).render(
  <>
    <ValidationRow passed label="hub" message="Matches expected value ERCOT." />
    <ValidationRow passed label="approvalRequired" message="Flag correctly set to true." />
    <ValidationRow label="peakPrice" message="Value not recognized." hint="Find the spike value before it settled." />
  </>
);
</script>
</body>
</html>
